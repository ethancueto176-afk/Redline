
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REDLINE ARENA</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#080808;color:white;font-family:Arial,sans-serif}
#enter{position:fixed;z-index:5;top:40%;left:50%;transform:translate(-50%,-50%);background:#e51b35;color:white;border:3px solid white;border-radius:16px;padding:24px 42px;font-size:30px;font-weight:bold;box-shadow:0 0 25px #ff1735}
#status{position:fixed;z-index:5;bottom:15px;width:100%;text-align:center;pointer-events:none;font-weight:bold;text-shadow:0 0 8px black;padding:0 12px}
canvas{display:block}
</style>
</head>
<body>
<button id="enter">ENTER VR</button>
<div id="status">REDLINE ARENA — CONNECTING...</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getFirestore,doc,getDoc,setDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import {getAuth,signInAnonymously} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

// FIREBASE CONNECTION — PRESERVED
const firebaseConfig={
 apiKey:"AIzaSyCvB7N_XK2kLYhwn8xwHI5It4TS7dMjKQk",
 authDomain:"redline-arena.firebaseapp.com",
 projectId:"redline-arena",
 storageBucket:"redline-arena.firebasestorage.app",
 messagingSenderId:"94653220727",
 appId:"1:94653220727:web:f8d3f1184189bb451b4372",
 measurementId:"G-8SCPFK600M"
};

const firebaseApp=initializeApp(firebaseConfig);
const db=getFirestore(firebaseApp);
const auth=getAuth(firebaseApp);
let currentRoomCode="";
let firebaseReady=false;

function setStatus(message){
 document.getElementById("status").textContent=message;
}

const authReady=signInAnonymously(auth).then(()=>{
 firebaseReady=true;
 setStatus("REDLINE ARENA — FIREBASE CONNECTED");
}).catch(error=>{
 console.error(error);
 setStatus("FIREBASE ERROR: "+error.message);
 throw error;
});

// THREE.JS
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x090b12);
scene.fog=new THREE.Fog(0x090b12,22,55);

const playerRig=new THREE.Group();
scene.add(playerRig);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,100);
camera.position.set(0,1.6,2);
playerRig.add(camera);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.xr.enabled=true;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x333344,2));
const light=new THREE.PointLight(0xff1735,35,30);
light.position.set(0,4,-3);
scene.add(light);

// ARENA
const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(18,18),
 new THREE.MeshStandardMaterial({color:0x30343e,roughness:.9})
);
floor.rotation.x=-Math.PI/2;
floor.position.z=-2;
floor.receiveShadow=true;
scene.add(floor);

const grid=new THREE.GridHelper(18,36,0xff1735,0x555966);
grid.position.set(0,.025,-2);
scene.add(grid);

function wall(x,y,z,w,h,d){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color:0x252832})
 );
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 scene.add(m);
}
wall(0,2,-11,18,4,.3);
wall(-9,2,-2,.3,4,18);
wall(9,2,-2,.3,4,18);
wall(0,4,-2,18,.3,18);

// TEXT AND BOX HELPERS
function makeText(message,color="#ffffff"){
 const canvas=document.createElement("canvas");
 canvas.width=1024;
 canvas.height=512;
 const ctx=canvas.getContext("2d");
 ctx.fillStyle="#10131c";
 ctx.fillRect(0,0,1024,512);
 const lines=String(message).split("\n");
 ctx.fillStyle=color;
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 const size=lines.length>4?38:55;
 ctx.font="bold "+size+"px Arial";
 const lineHeight=size*1.35;
 const start=256-(lines.length-1)*lineHeight/2;
 lines.forEach((line,i)=>ctx.fillText(line,512,start+i*lineHeight,950));
 const texture=new THREE.CanvasTexture(canvas);
 texture.colorSpace=THREE.SRGBColorSpace;
 return texture;
}

function solidBox(w,h,d,color,x,y,z,parent){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color,roughness:.8})
 );
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 parent.add(mesh);
 return mesh;
}

// COMPUTER AND SHELF — NO TABLES
const computer=new THREE.Group();
computer.position.set(0,0,-7);
scene.add(computer);

// Shelf
solidBox(2.9,.16,1.5,0x454650,0,.9,0,computer);
solidBox(2.92,.055,.06,0xff1735,0,.82,.72,computer);
solidBox(.16,.82,.16,0x252832,-1.2,.4,-.58,computer);
solidBox(.16,.82,.16,0x252832,1.2,.4,-.58,computer);
solidBox(.16,.82,.16,0x252832,-1.2,.4,.58,computer);
solidBox(.16,.82,.16,0x252832,1.2,.4,.58,computer);

// Monitor
solidBox(2,1.45,.15,0x111827,0,2.05,-.22,computer);
const screenFace=new THREE.Mesh(
 new THREE.PlaneGeometry(1.85,1.3),
 new THREE.MeshBasicMaterial({map:makeText("REDLINE ARENA","#ff263f")})
);
screenFace.position.set(0,2.05,-.135);
computer.add(screenFace);

function screenMessage(message){
 if(screenFace.material.map)screenFace.material.map.dispose();
 screenFace.material.map=makeText(message,"#ff4055");
 screenFace.material.needsUpdate=true;
}

// COMPUTER BUTTONS
const menuButtons=[];

function clearMenu(){
 for(const button of menuButtons){
  computer.remove(button);
  button.traverse(child=>{
   if(child.geometry)child.geometry.dispose();
   if(child.material){
    if(child.material.map)child.material.map.dispose();
    child.material.dispose();
   }
  });
 }
 menuButtons.length=0;
}

function addComputerButton(label,x,y,action,width=.62){
 const button=solidBox(width,.22,.12,0xa51027,x,y,.03,computer);
 button.userData.action=action;
 const labelMesh=new THREE.Mesh(
  new THREE.PlaneGeometry(width-.04,.17),
  new THREE.MeshBasicMaterial({map:makeText(label)})
 );
 labelMesh.position.set(0,0,.066);
 button.add(labelMesh);
 menuButtons.push(button);
 return button;
}

let gameMode="MENU";
let enteredRoomCode="";

// PRIVATE ROOM CREATION
async function createPrivateRoom(){
 try{
  setStatus("CONNECTING TO FIREBASE...");
  await authReady;

  for(let attempt=0;attempt<10;attempt++){
   const code=String(Math.floor(1000+Math.random()*9000));
   const roomRef=doc(db,"rooms",code);
   const existing=await getDoc(roomRef);
   if(existing.exists())continue;

   await setDoc(roomRef,{
    code,
    hostUid:auth.currentUser.uid,
    status:"open",
    createdAt:serverTimestamp()
   });

   currentRoomCode=code;
   showWaitingRoom();
   return;
  }
  setStatus("COULD NOT CREATE ROOM — TRY AGAIN");
 }catch(error){
  console.error(error);
  setStatus("ROOM ERROR ["+(error.code||"unknown")+"]: "+error.message);
 }
}

// JOIN PRIVATE ROOM
async function joinPrivateRoom(code){
 code=String(code||"").trim();
 if(!/^\d{4}$/.test(code)){
  setStatus("PLEASE ENTER A 4-DIGIT CODE");
  return;
 }

 try{
  setStatus("CHECKING ROOM "+code+"...");
  await authReady;
  const roomRef=doc(db,"rooms",code);
  const roomSnap=await getDoc(roomRef);

  if(!roomSnap.exists()){
   screenMessage("ROOM NOT FOUND\nCHECK YOUR CODE");
   setStatus("ROOM "+code+" DOES NOT EXIST");
   return;
  }

  const room=roomSnap.data();
  if(room.status!=="open"){
   screenMessage("ROOM CLOSED");
   setStatus("THIS ROOM IS NOT OPEN");
   return;
  }

  currentRoomCode=code;
  showWaitingRoom();
 }catch(error){
  console.error(error);
  setStatus("JOIN ERROR ["+(error.code||"unknown")+"]: "+error.message);
 }
}

// MAIN COMPUTER MENU
function showMainMenu(){
 clearMenu();
 gameMode="MENU";
 screenMessage("REDLINE ARENA\nSELECT AN OPTION");

 addComputerButton("CREATE",-.68,1.04,createPrivateRoom);
 addComputerButton("JOIN",0,1.04,showJoinKeyboard);
 addComputerButton("PRACTICE",.68,1.04,()=>{
  gameMode="PRACTICE";
  clearMenu();
  screenMessage("PRACTICE MODE\nHAVE FUN!");
  setStatus("PRACTICE MODE — WALK AND JUMP!");
 });
}

// FOUR-DIGIT JOIN KEYPAD
function showJoinKeyboard(){
 clearMenu();
 enteredRoomCode="";
 screenMessage("ENTER ROOM CODE\n_ _ _ _");

 const digits=[
  ["1",-.68,1.04],["2",0,1.04],["3",.68,1.04],
  ["4",-.68,.76],["5",0,.76],["6",.68,.76],
  ["7",-.68,.48],["8",0,.48],["9",.68,.48],
  ["0",0,.20]
 ];

 for(const [digit,x,y] of digits){
  addComputerButton(digit,x,y,()=>{
   if(enteredRoomCode.length>=4)return;
   enteredRoomCode+=digit;
   screenMessage("ENTER ROOM CODE\n"+enteredRoomCode.padEnd(4,"_").split("").join(" "));
  },.55);
 }

 addComputerButton("ENTER",-.48,-.12,()=>{
  if(enteredRoomCode.length!==4){
   setStatus("ENTER ALL 4 DIGITS FIRST");
   return;
  }
  joinPrivateRoom(enteredRoomCode);
 },.85);

 addComputerButton("CANCEL",.48,-.12,showMainMenu,.85);
}

// PRIVATE WAITING ROOM AND LEADERBOARD
function showWaitingRoom(){
 clearMenu();
 gameMode="PRIVATE_WAITING";

 const uid=auth.currentUser?auth.currentUser.uid:"NOT SIGNED IN";
 screenMessage(
  "PRIVATE WAITING ROOM\n"+
  "ROOM CODE: "+currentRoomCode+"\n"+
  "LEADERBOARD\n"+
  "YOU: "+uid.slice(0,16)+"\n"+
  "PLAYER SYNC NOT ENABLED"
 );

 setStatus("PRIVATE ROOM "+currentRoomCode+" — WAITING ROOM");
 addComputerButton("BACK TO MENU",0,1.04,showMainMenu,1.25);
}

showMainMenu();
computer.visible=false;

// GORILLA BODY
const bodyMaterial=new THREE.MeshStandardMaterial({color:0x08090c,roughness:.82});
const faceMaterial=new THREE.MeshStandardMaterial({color:0x090a0d,roughness:.9});
const chestMaterial=new THREE.MeshStandardMaterial({color:0x111216,roughness:.85});
const lavaMaterial=new THREE.MeshStandardMaterial({
 color:0xff102c,emissive:0xff001b,emissiveIntensity:1.35,roughness:.4
});
const darkEyeMaterial=new THREE.MeshStandardMaterial({color:0x050505,roughness:.3});

const torso=new THREE.Mesh(new THREE.SphereGeometry(.28,24,20),bodyMaterial);
torso.scale.set(.86,.72,.68);
torso.castShadow=true;
scene.add(torso);

const head=new THREE.Mesh(new THREE.SphereGeometry(.17,24,20),bodyMaterial);
head.castShadow=true;
scene.add(head);

const face=new THREE.Mesh(new THREE.SphereGeometry(.115,20,16),faceMaterial);
face.scale.set(1.05,.9,.4);
scene.add(face);

for(let i=0;i<2;i++){
 const eye=new THREE.Mesh(new THREE.SphereGeometry(.025,16,12),darkEyeMaterial);
 eye.position.set(i===0?-.04:.04,.015,-.045);
 face.add(eye);
}

const chest=new THREE.Mesh(new THREE.SphereGeometry(.13,20,16),chestMaterial);
chest.scale.set(1,1,.18);
scene.add(chest);

const chestLava=[];
for(let i=0;i<2;i++){
 const line=new THREE.Mesh(new THREE.BoxGeometry(.015,.11,.015),lavaMaterial);
 line.rotation.z=i===0?-.35:.35;
 scene.add(line);
 chestLava.push(line);
}

// ARMS AND HANDS
const arms=[];

function makeArm(){
 const arm=new THREE.Mesh(new THREE.CylinderGeometry(.085,.105,1,16),bodyMaterial);
 const hand=new THREE.Mesh(new THREE.SphereGeometry(.09,16,12),bodyMaterial);
 const bands=[];

 for(let i=0;i<2;i++){
  const band=new THREE.Mesh(new THREE.TorusGeometry(.095,.012,8,24),lavaMaterial);
  band.rotation.x=Math.PI/2;
  scene.add(band);
  bands.push(band);
 }

 scene.add(arm);
 scene.add(hand);
 return {arm,hand,bands};
}

arms.push(makeArm(),makeArm());

function setArmVisible(arm,visible){
 arm.arm.visible=visible;
 arm.hand.visible=visible;
 arm.bands.forEach(b=>b.visible=visible);
}
arms.forEach(arm=>setArmVisible(arm,false));

function updateSegment(mesh,start,end){
 const direction=new THREE.Vector3().subVectors(end,start);
 const length=direction.length();
 mesh.position.copy(start).add(end).multiplyScalar(.5);
 mesh.scale.y=length;
 mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),direction.normalize());
}

// CONTROLLERS
const controllers=[];

for(let i=0;i<2;i++){
 const controller=renderer.xr.getController(i);
 controller.userData.connected=false;
 controller.userData.handedness=i===0?"left":"right";

 controller.addEventListener("connected",event=>{
  const hand=event.data?.handedness;
  controller.userData.connected=true;
  if(hand==="left"||hand==="right")controller.userData.handedness=hand;
  const index=controller.userData.handedness==="left"?0:1;
  setArmVisible(arms[index],true);
  setStatus(controller.userData.handedness.toUpperCase()+" CONTROLLER CONNECTED");
 });

 controller.addEventListener("disconnected",()=>{
  controller.userData.connected=false;
  const index=controller.userData.handedness==="left"?0:1;
  setArmVisible(arms[index],false);
  setStatus(controller.userData.handedness.toUpperCase()+" CONTROLLER DISCONNECTED");
 });

 playerRig.add(controller);

 const laser=new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([
   new THREE.Vector3(0,0,0),new THREE.Vector3(0,0,-4)
  ]),
  new THREE.LineBasicMaterial({color:0xff263f})
 );
 controller.add(laser);

 controller.addEventListener("select",()=>checkController(controller));
 controllers.push(controller);
}

// COMPUTER INTERACTION
const raycaster=new THREE.Raycaster();
const headPosition=new THREE.Vector3();
const deskPosition=new THREE.Vector3();
const handPosition=new THREE.Vector3();
const shoulder=new THREE.Vector3();

function computerDistance(){
 const view=renderer.xr.getCamera(camera);
 view.getWorldPosition(headPosition);
 computer.getWorldPosition(deskPosition);
 deskPosition.y+=1.6;
 return headPosition.distanceTo(deskPosition);
}

function checkController(controller){
 if(!renderer.xr.isPresenting)return;
 if(computerDistance()>3.5)return;

 const origin=new THREE.Vector3();
 const direction=new THREE.Vector3();
 const rotation=new THREE.Quaternion();

 controller.getWorldPosition(origin);
 controller.getWorldQuaternion(rotation);
 direction.set(0,0,-1).applyQuaternion(rotation);

 raycaster.set(origin,direction);
 raycaster.far=5;

 const hits=raycaster.intersectObjects(menuButtons,false);
 if(hits.length&&hits[0].object.userData.action){
  hits[0].object.userData.action();
 }
}

// HEIGHT CALIBRATION
let calibrated=false;
let playerHeight=1.6;
let calibrationAttempts=0;

function calibrateHeight(){
 if(calibrated||!renderer.xr.isPresenting)return;
 const view=renderer.xr.getCamera(camera);
 view.getWorldPosition(headPosition);
 const measuredHeight=headPosition.y-playerRig.position.y;

 if(measuredHeight>.5&&measuredHeight<3){
  playerHeight=THREE.MathUtils.clamp(measuredHeight,1,2.3);
  calibrated=true;
  setStatus("VR READY — HEIGHT SET: "+playerHeight.toFixed(2)+" METERS");
  return;
 }

 calibrationAttempts++;
 if(calibrationAttempts>120){
  playerHeight=1.6;
  calibrated=true;
  setStatus("VR READY — DEFAULT HEIGHT SET");
 }
}

// ENTER VR
document.getElementById("enter").addEventListener("click",async()=>{
 try{
  if(!navigator.xr){
   setStatus("OPEN THIS GAME IN QUEST BROWSER");
   return;
  }

  const supported=await navigator.xr.isSessionSupported("immersive-vr");
  if(!supported){
   setStatus("VR NOT SUPPORTED");
   return;
  }

  const session=await navigator.xr.requestSession("immersive-vr",{
   requiredFeatures:["local-floor"],
   optionalFeatures:["hand-tracking"]
  });

  renderer.xr.setReferenceSpaceType("local-floor");
  await renderer.xr.setSession(session);

  playerRig.position.set(0,0,0);
  computer.visible=true;
  showMainMenu();

  calibrated=false;
  playerHeight=1.6;
  calibrationAttempts=0;

  document.getElementById("enter").style.display="none";
  setStatus("REDLINE ARENA — ENTERING VR");

  session.addEventListener("end",()=>{
   computer.visible=false;
   document.getElementById("enter").style.display="block";
   controllers.forEach(c=>c.userData.connected=false);
   arms.forEach(a=>setArmVisible(a,false));
   setStatus("REDLINE ARENA — READY");
  });
 }catch(error){
  console.error(error);
  setStatus("VR ERROR: "+error.message);
 }
});

// WALKING AND JUMPING
let verticalVelocity=0;
let grounded=true;
let jumpWasDown=false;
const gravity=9.8;
const jumpPower=4.2;
const walkSpeed=2.8;

function movePlayer(delta){
 if(!renderer.xr.isPresenting)return;
 const session=renderer.xr.getSession();
 if(!session)return;

 let stickX=0,stickY=0,jumpDown=false;

 for(const source of session.inputSources){
  if(!source.gamepad)continue;

  if(source.handedness==="left"){
   const axes=source.gamepad.axes;
   if(axes.length>=2){
    stickX=axes[axes.length-2]||0;
    stickY=axes[axes.length-1]||0;
   }
  }

  if(source.handedness==="right"){
   const buttons=source.gamepad.buttons;
   jumpDown=!!(
    (buttons[4]&&buttons[4].pressed)||
    (buttons[3]&&buttons[3].pressed)
   );
  }
 }

 if(Math.abs(stickX)>.15||Math.abs(stickY)>.15){
  const view=renderer.xr.getCamera(camera);
  const forward=new THREE.Vector3();
  view.getWorldDirection(forward);
  forward.y=0;
  forward.normalize();

  const right=new THREE.Vector3()
   .crossVectors(forward,new THREE.Vector3(0,1,0)).normalize();

  playerRig.position.addScaledVector(forward,-stickY*walkSpeed*delta);
  playerRig.position.addScaledVector(right,stickX*walkSpeed*delta);
 }

 if(jumpDown&&!jumpWasDown&&grounded){
  verticalVelocity=jumpPower;
  grounded=false;
 }
 jumpWasDown=jumpDown;

 verticalVelocity-=gravity*delta;
 playerRig.position.y+=verticalVelocity*delta;

 if(playerRig.position.y<=0){
  playerRig.position.y=0;
  verticalVelocity=0;
  grounded=true;
 }
}

// BODY AND ARM TRACKING
function updateBody(){
 if(!renderer.xr.isPresenting)return;

 const view=renderer.xr.getCamera(camera);
 view.getWorldPosition(headPosition);

 torso.position.copy(headPosition);
 torso.position.y-=playerHeight*.40;
 torso.scale.set(.86,.72*(playerHeight/1.6),.68);

 head.position.copy(headPosition);
 head.position.y-=.13;

 face.position.copy(head.position);
 face.position.y+=.005;
 face.position.z-=.095;

 chest.position.copy(torso.position);
 chest.position.z-=.18;

 chestLava[0].position.set(
  torso.position.x-.035,torso.position.y+.01,torso.position.z-.205
 );
 chestLava[1].position.set(
  torso.position.x+.035,torso.position.y-.01,torso.position.z-.205
 );

 for(let i=0;i<2;i++){
  const controller=controllers[i];
  const arm=arms[i];

  if(!controller.userData.connected){
   setArmVisible(arm,false);
   continue;
  }

  setArmVisible(arm,true);
  controller.getWorldPosition(handPosition);

  shoulder.copy(headPosition);
  shoulder.x+=(controller.userData.handedness==="left"?-.19:.19);
  shoulder.y-=playerHeight*.22;
  shoulder.z+=.035;

  updateSegment(arm.arm,shoulder,handPosition);
  arm.hand.position.copy(handPosition);

  const direction=new THREE.Vector3().subVectors(handPosition,shoulder);
  const length=direction.length();
  direction.normalize();

  for(let b=0;b<arm.bands.length;b++){
   const fraction=b===0?.32:.7;
   arm.bands[b].position.copy(shoulder).addScaledVector(direction,length*fraction);
   arm.bands[b].quaternion.copy(arm.arm.quaternion);
   arm.bands[b].rotateX(Math.PI/2);
  }
 }
}

// GAME LOOP
let lastTime=performance.now();
let nearComputer=false;

renderer.setAnimationLoop(()=>{
 const now=performance.now();
 const delta=Math.min((now-lastTime)/1000,.05);
 lastTime=now;

 if(renderer.xr.isPresenting){
  if(!calibrated)calibrateHeight();
  movePlayer(delta);
  updateBody();

  if(computer.visible){
   const near=computerDistance()<3.5;
   if(near&&!nearComputer)setStatus("COMPUTER READY — AIM AND PRESS TRIGGER");
   if(!near&&nearComputer)setStatus("WALK TO THE COMPUTER");
   nearComputer=near;
  }
 }

 renderer.render(scene,camera);
});

// RESIZE
window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

authReady.catch(error=>console.error("Firebase is not ready:",error));
</script>
</body>
</html>

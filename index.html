
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REDLINE ARENA</title>
<style>
body{margin:0;overflow:hidden;background:#080808;color:white;font-family:Arial}
#enter{
 position:fixed;z-index:5;top:40%;left:50%;
 transform:translate(-50%,-50%);
 background:#e51b35;color:white;border:3px solid white;
 border-radius:16px;padding:24px 42px;font-size:30px;
 font-weight:bold;box-shadow:0 0 25px #ff1735;
}
#status{
 position:fixed;z-index:5;bottom:15px;width:100%;
 text-align:center;pointer-events:none;font-weight:bold;
 text-shadow:0 0 8px black;
}
</style>
</head>
<body>
<button id="enter">ENTER VR</button>
<div id="status">REDLINE ARENA — READY</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// SCENE
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x090b12);
scene.fog=new THREE.Fog(0x090b12,12,35);

// PLAYER
const playerRig=new THREE.Group();
scene.add(playerRig);

const camera=new THREE.PerspectiveCamera(
 70,innerWidth/innerHeight,0.1,100
);
camera.position.set(0,1.6,2);
playerRig.add(camera);

// RENDERER
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.xr.enabled=true;
document.body.appendChild(renderer.domElement);

// LIGHTS
scene.add(new THREE.HemisphereLight(0xffffff,0x333344,2));

const light=new THREE.PointLight(0xff1735,35,25);
light.position.set(0,4,-3);
scene.add(light);

// STARTING ROOM
const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(18,18),
 new THREE.MeshStandardMaterial({color:0x20232b})
);
floor.rotation.x=-Math.PI/2;
floor.position.z=-2;
scene.add(floor);

const grid=new THREE.GridHelper(18,36,0xff1735,0x444455);
grid.position.set(0,0.02,-2);
scene.add(grid);

// ROOM WALLS
function wall(x,y,z,w,h,d){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({
   color:0x252832,
   emissive:0x190008
  })
 );
 m.position.set(x,y,z);
 scene.add(m);
}
wall(0,2,-11,18,4,0.3);
wall(-9,2,-2,0.3,4,18);
wall(9,2,-2,0.3,4,18);
wall(0,4,-2,18,0.3,18);

// TEXTURE HELPER
function makeText(text,color="#ffffff"){
 const canvas=document.createElement("canvas");
 canvas.width=1024;
 canvas.height=256;
 const ctx=canvas.getContext("2d");
 ctx.fillStyle="#10131c";
 ctx.fillRect(0,0,1024,256);
 ctx.fillStyle=color;
 ctx.font="bold 75px Arial";
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.fillText(text,512,128);
 const texture=new THREE.CanvasTexture(canvas);
 texture.colorSpace=THREE.SRGBColorSpace;
 return texture;
}

// COMPUTER
const computer=new THREE.Group();
computer.position.set(0,0,-7);
scene.add(computer);

const desk=new THREE.Mesh(
 new THREE.BoxGeometry(2.8,0.25,1.2),
 new THREE.MeshStandardMaterial({color:0x33343b})
);
desk.position.set(0,0.9,0);
computer.add(desk);

const leg=new THREE.Mesh(
 new THREE.BoxGeometry(0.25,0.9,0.25),
 new THREE.MeshStandardMaterial({color:0x17191f})
);
leg.position.set(0,0.4,0);
computer.add(leg);

const screen=new THREE.Mesh(
 new THREE.BoxGeometry(2,1.35,0.12),
 new THREE.MeshStandardMaterial({
  color:0x111827,
  emissive:0x170008
 })
);
screen.position.set(0,1.75,-0.25);
computer.add(screen);

const screenFace=new THREE.Mesh(
 new THREE.PlaneGeometry(1.85,1.2),
 new THREE.MeshBasicMaterial({map:makeText("REDLINE ARENA","#ff263f")})
);
screenFace.position.set(0,1.75,-0.18);
computer.add(screenFace);

// COMPUTER MENU BUTTONS
const menuButtons=[];
let computerPage="main";

function screenMessage(message){
 screenFace.material.map.dispose();
 screenFace.material.map=makeText(message,"#ff4055");
 screenFace.material.needsUpdate=true;
}

function clearMenu(){
 for(const b of menuButtons){
  computer.remove(b);
 }
 menuButtons.length=0;
}

function addComputerButton(label,y,action){
 const button=new THREE.Mesh(
  new THREE.BoxGeometry(1.65,0.27,0.09),
  new THREE.MeshStandardMaterial({
   color:0x9d1025,
   emissive:0x330008
  })
 );
 button.position.set(0,y,-0.08);
 button.userData.action=action;

 const labelMesh=new THREE.Mesh(
  new THREE.PlaneGeometry(1.5,0.22),
  new THREE.MeshBasicMaterial({map:makeText(label)})
 );
 labelMesh.position.set(0,0,0.052);
 button.add(labelMesh);

 computer.add(button);
 menuButtons.push(button);
}

function showMainMenu(){
 computerPage="main";
 clearMenu();
 screenMessage("CHOOSE YOUR GAME");

 addComputerButton(1.35,"PRACTICE MODE",()=>{
  screenMessage("PRACTICE MODE");
  document.getElementById("status").textContent=
   "PRACTICE MODE — YOU ARE PLAYING SOLO";
 });

 addComputerButton(1.02,"PUBLIC MODE",()=>{
  screenMessage("SEARCHING PUBLIC...");
  document.getElementById("status").textContent=
   "PUBLIC MODE — SERVER CONNECTION NOT SET UP YET";
 });

 addComputerButton(0.69,"PRIVATE MODE",()=>{
  showPrivateMenu();
 });
}

function showPrivateMenu(){
 computerPage="private";
 clearMenu();
 screenMessage("PRIVATE ROOMS");

 addComputerButton(1.35,"CREATE ROOM CODE",()=>{
  const code=String(Math.floor(1000+Math.random()*9000));
  screenMessage("YOUR CODE: "+code);
  document.getElementById("status").textContent=
   "YOUR PRIVATE ROOM CODE: "+code+" — SHARE IT WITH FRIENDS";
 });

 addComputerButton(1.02,"ENTER FRIEND CODE",()=>{
  const code=prompt("Enter your friend's private room code:");
  if(code && code.trim()){
   screenMessage("JOINING: "+code.trim());
   document.getElementById("status").textContent=
    "PRIVATE ROOM "+code.trim()+" — SERVER CONNECTION NOT SET UP YET";
  }
 });

 addComputerButton(0.69,"BACK",()=>{
  showMainMenu();
 });
}

showMainMenu();

// COMPUTER HIDDEN UNTIL VR
computer.visible=false;

// CONTROLLERS
const raycaster=new THREE.Raycaster();
const controllers=[];

function computerDistance(){
 const head=new THREE.Vector3();
 const deskPosition=new THREE.Vector3();
 renderer.xr.getCamera(camera).getWorldPosition(head);
 computer.getWorldPosition(deskPosition);
 return head.distanceTo(deskPosition);
}

function checkController(controller){
 if(!renderer.xr.isPresenting)return;

 // Must walk close to the computer first.
 if(computerDistance()>2.2)return;

 const origin=new THREE.Vector3();
 const direction=new THREE.Vector3();
 const rotation=new THREE.Quaternion();

 controller.getWorldPosition(origin);
 controller.getWorldQuaternion(rotation);
 direction.set(0,0,-1).applyQuaternion(rotation).normalize();

 raycaster.set(origin,direction);
 raycaster.far=4;

 const hits=raycaster.intersectObjects(menuButtons,false);
 if(hits.length && hits[0].object.userData.action){
  hits[0].object.userData.action();
 }
}

for(let i=0;i<2;i++){
 const controller=renderer.xr.getController(i);
 playerRig.add(controller);

 const laser=new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([
   new THREE.Vector3(0,0,0),
   new THREE.Vector3(0,0,-4)
  ]),
  new THREE.LineBasicMaterial({
   color:0xff263f,
   depthTest:false
  })
 );
 laser.renderOrder=999;
 controller.add(laser);

 controller.addEventListener("select",()=>{
  checkController(controller);
 });

 controllers.push(controller);
}

// VR SESSION
document.getElementById("enter").addEventListener("click",async()=>{
 try{
  if(!navigator.xr){
   document.getElementById("status").textContent=
    "WEBXR NOT AVAILABLE — OPEN THIS ON YOUR QUEST";
   return;
  }

  const supported=await navigator.xr.isSessionSupported("immersive-vr");
  if(!supported){
   document.getElementById("status").textContent="VR NOT SUPPORTED";
   return;
  }

  const session=await navigator.xr.requestSession("immersive-vr",{
   optionalFeatures:["local-floor","hand-tracking"]
  });

  renderer.xr.setReferenceSpaceType("local-floor");
  await renderer.xr.setSession(session);

  // Spawn inside the starting room.
  playerRig.position.set(0,0,0);

  // Show the computer only after entering VR.
  computer.visible=true;
  showMainMenu();

  document.getElementById("enter").style.display="none";
  document.getElementById("status").textContent=
   "WELCOME TO REDLINE ARENA — WALK TO THE COMPUTER";

  session.addEventListener("end",()=>{
   computer.visible=false;
   document.getElementById("enter").style.display="block";
   document.getElementById("status").textContent=
    "REDLINE ARENA — READY";
  });

 }catch(error){
  document.getElementById("status").textContent=
   "VR ERROR: "+error.message;
 }
});

// CONTROLLER WALKING
let lastTime=performance.now();

function movePlayer(delta){
 if(!renderer.xr.isPresenting)return;

 const session=renderer.xr.getSession();
 if(!session)return;

 let moveX=0;
 let moveY=0;

 for(const source of session.inputSources){
  if(source.handedness==="left" && source.gamepad){
   const axes=source.gamepad.axes;
   moveX=axes[axes.length-2]||0;
   moveY=axes[axes.length-1]||0;
   break;
  }
 }

 if(Math.abs(moveX)<0.15)moveX=0;
 if(Math.abs(moveY)<0.15)moveY=0;

 const view=renderer.xr.getCamera(camera);
 const forward=new THREE.Vector3();
 view.getWorldDirection(forward);
 forward.y=0;
 forward.normalize();

 const right=new THREE.Vector3()
  .crossVectors(forward,new THREE.Vector3(0,1,0))
  .normalize();

 const speed=2.5;
 playerRig.position.addScaledVector(forward,-moveY*speed*delta);
 playerRig.position.addScaledVector(right,moveX*speed*delta);
}

// STATUS WHEN NEAR COMPUTER
let nearComputer=false;

renderer.setAnimationLoop(()=>{
 const now=performance.now();
 const delta=Math.min((now-lastTime)/1000,0.05);
 lastTime=now;

 movePlayer(delta);

 if(renderer.xr.isPresenting && computer.visible){
  const near=computerDistance()<2.2;

  if(near && !nearComputer){
   document.getElementById("status").textContent=
    "COMPUTER READY — POINT AND PRESS TRIGGER";
  }

  if(!near && nearComputer){
   document.getElementById("status").textContent=
    "WALK TO THE COMPUTER";
  }

  nearComputer=near;
 }

 renderer.render(scene,camera);
});

// RESIZE
window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>

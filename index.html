<head>

<button id="enter">ENTER VR</button>
<div id="status">REDLINE ARENA — CONNECTING...</div>

<script type="module">

'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

import { initializeApp } from
'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

import {
 getFirestore,doc,getDoc,setDoc,serverTimestamp
} from
'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

import {
 getAuth,signInAnonymously
} from
'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

// ===================================
// FIREBASE CONNECTION — PRESERVED
// ===================================

const firebaseConfig={
 apiKey: "AIzaSyCvB7N_XK2kLYhwn8xwHI5It4TS7dMjKQk",
 authDomain:"redline-arena.firebaseapp.com",
 projectId:"redline-arena",
 storageBucket:"redline-arena.firebasestorage.app",
 messagingSenderId:"94653220727",
 appId:"1:94653220727:web:f8d3f1184189bb451b4372",
 measurementId:"G-8SCPFK600M"
};

const firebaseApp=initializeApp(firebaseConfig);
const db=getFirestore(firebaseApp);
const auth=getAuth(firebaseApp);

let currentRoomCode="";
let firebaseReady=false;

const authReady=signInAnonymously(auth)
 .then(()=>{
  firebaseReady=true;
  setStatus("REDLINE ARENA — FIREBASE CONNECTED");
 })
 .catch(error=>{
  console.error("Firebase sign-in error:",error);
  setStatus("FIREBASE ERROR ["+(error.code||"unknown")+"]: "+error.message);
  throw error;
 });

// ===================================
// PRIVATE ROOM CREATION — PRESERVED
// ===================================

async function createPrivateRoom(){
 try{
  setStatus("CONNECTING TO FIREBASE...");
  await authReady;

  for(let attempt=0;attempt<10;attempt++){
   const code=String(Math.floor(1000+Math.random()*9000));
   const roomRef=doc(db,"rooms",code);
   const existing=await getDoc(roomRef);

   if(existing.exists())continue;

   await setDoc(roomRef,{
    code:code,
    hostUid:auth.currentUser.uid,
    status:"open",
    createdAt:serverTimestamp()
   });

   currentRoomCode=code;
   screenMessage("YOUR CODE: "+code);
   setStatus("YOUR PRIVATE ROOM CODE: "+code);
   return;
  }

  setStatus("COULD NOT CREATE ROOM — TRY AGAIN");
 }catch(error){
  console.error("Room creation error:",error);
  setStatus("ROOM ERROR ["+(error.code||"unknown")+"]: "+error.message);
 }
}

// ===================================
// JOIN PRIVATE ROOM — PRESERVED
// ===================================

async function joinPrivateRoom(){
 const entered=prompt("Enter your friend's 4-digit room code:");
 if(!entered)return;

 const code=entered.trim();

 if(!/^\d{4}$/.test(code)){
  setStatus("PLEASE ENTER A 4-DIGIT CODE");
  return;
 }

 try{
  setStatus("CHECKING ROOM "+code+"...");
  await authReady;

  const roomRef=doc(db,"rooms",code);
  const roomSnap=await getDoc(roomRef);

  if(!roomSnap.exists()){
   screenMessage("ROOM NOT FOUND");
   setStatus("ROOM "+code+" DOES NOT EXIST");
   return;
  }

  const room=roomSnap.data();

  if(room.status!=="open"){
   screenMessage("ROOM CLOSED");
   setStatus("THIS ROOM IS NOT OPEN");
   return;
  }

  currentRoomCode=code;
  screenMessage("ROOM FOUND: "+code);
  setStatus("ROOM FOUND — MULTIPLAYER SYNC NOT BUILT YET");
 }catch(error){
  console.error("Join room error:",error);
  setStatus("JOIN ERROR ["+(error.code||"unknown")+"]: "+error.message);
 }
}

// ===================================
// THREE.JS SETUP
// ===================================

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x090b12);
scene.fog=new THREE.Fog(0x090b12,18,45);

const playerRig=new THREE.Group();
scene.add(playerRig);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,100);
camera.position.set(0,1.6,2);
playerRig.add(camera);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.xr.enabled=true;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x333344,2));

const light=new THREE.PointLight(0xff1735,35,25);
light.position.set(0,4,-3);
scene.add(light);

// ===================================
// ARENA
// ===================================

const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(18,18),
 new THREE.MeshStandardMaterial({color:0x20232b,roughness:.9})
);
floor.rotation.x=-Math.PI/2;
floor.position.z=-2;
floor.receiveShadow=true;
scene.add(floor);

const grid=new THREE.GridHelper(18,36,0xff1735,0x444455);
grid.position.set(0,.02,-2);
scene.add(grid);

function wall(x,y,z,w,h,d){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color:0x252832})
 );
 m.position.set(x,y,z);
 m.receiveShadow=true;
 m.castShadow=true;
 scene.add(m);
 return m;
}

wall(0,2,-11,18,4,.3);
wall(-9,2,-2,.3,4,18);
wall(9,2,-2,.3,4,18);
wall(0,4,-2,18,.3,18);

// ===================================
// TEXT AND OBJECT HELPERS
// ===================================

function makeText(message,color="#ffffff"){
 const canvas=document.createElement("canvas");
 canvas.width=1024;
 canvas.height=256;

 const ctx=canvas.getContext("2d");
 ctx.fillStyle="#10131c";
 ctx.fillRect(0,0,1024,256);
 ctx.fillStyle=color;
 ctx.font="bold 65px Arial";
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.fillText(message,512,128);

 const texture=new THREE.CanvasTexture(canvas);
 texture.colorSpace=THREE.SRGBColorSpace;
 return texture;
}

function solidBox(w,h,d,color,x,y,z,parent){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color,roughness:.8})
 );
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 parent.add(mesh);
 return mesh;
}

// ===================================
// COMPUTER
// ===================================

const computer=new THREE.Group();
computer.position.set(0,0,-7);
scene.add(computer);

solidBox(2.8,.25,1.2,0x33343b,0,.9,0,computer);
solidBox(.25,.9,.25,0x17191f,0,.4,0,computer);
solidBox(2,1.55,.12,0x111827,0,2.05,-.25,computer);

const screenFace=new THREE.Mesh(
 new THREE.PlaneGeometry(1.85,1.4),
 new THREE.MeshBasicMaterial({map:makeText("REDLINE ARENA","#ff263f")})
);
screenFace.position.set(0,2.05,-.18);
computer.add(screenFace);

const menuButtons=[];

function screenMessage(message){
 if(screenFace.material.map)screenFace.material.map.dispose();
 screenFace.material.map=makeText(message,"#ff4055");
 screenFace.material.needsUpdate=true;
}

function clearMenu(){
 for(const b of menuButtons)computer.remove(b);
 menuButtons.length=0;
}

function addComputerButton(label,y,action){
 const button=solidBox(1.65,.27,.09,0x9d1025,0,y,-.08,computer);
 button.userData.action=action;

 const labelMesh=new THREE.Mesh(
  new THREE.PlaneGeometry(1.5,.22),
  new THREE.MeshBasicMaterial({map:makeText(label)})
 );
 labelMesh.position.z=.052;
 button.add(labelMesh);
 menuButtons.push(button);
}

let gameMode="MENU";

function showPrivateMenu(){
 clearMenu();
 screenMessage("PRIVATE ROOMS");

 addComputerButton("CREATE ROOM CODE",1.7,createPrivateRoom);
 addComputerButton("ENTER FRIEND CODE",1.35,joinPrivateRoom);
 addComputerButton("BACK",1.0,showMainMenu);
}

function showMainMenu(){
 clearMenu();
 screenMessage("CHOOSE YOUR GAME");
 gameMode="MENU";

 addComputerButton("PRACTICE MODE",1.7,()=>{
  gameMode="PRACTICE";
  screenMessage("PRACTICE MODE");
  setStatus("PRACTICE MODE — WALK AND JUMP!");
 });

 addComputerButton("PUBLIC MODE",1.35,()=>{
  gameMode="PUBLIC";
  screenMessage("PUBLIC SERVER");
  setStatus("PUBLIC MULTIPLAYER IS NOT BUILT YET");
 });

 addComputerButton("PRIVATE MODE",1.0,showPrivateMenu);
}

showMainMenu();
computer.visible=false;

// ===================================
// SHELF
// ===================================

const shelf=new THREE.Group();
shelf.position.set(-3.2,0,-4);
scene.add(shelf);

const shelfWidth=2.8;
const shelfDepth=1.5;
const shelfTop=1.0;

solidBox(shelfWidth,.2,shelfDepth,0x55545d,0,.9,0,shelf);
solidBox(shelfWidth+.06,.08,shelfDepth+.06,0xff1735,0,.78,0,shelf);

solidBox(.18,.8,.18,0x292b33,-1.2,.4,-.6,shelf);
solidBox(.18,.8,.18,0x292b33,1.2,.4,-.6,shelf);
solidBox(.18,.8,.18,0x292b33,-1.2,.4,.6,shelf);
solidBox(.18,.8,.18,0x292b33,1.2,.4,.6,shelf);

// ===================================
// REDLINE GORILLA BODY
// SMALLER BODY + HIGHER FACE
// ===================================

const bodyMaterial=new THREE.MeshStandardMaterial({
 color:0x08090c,
 roughness:.82
});

// The face is now black instead of gray.
const faceMaterial=new THREE.MeshStandardMaterial({
 color:0x090a0d,
 roughness:.9
});

const chestMaterial=new THREE.MeshStandardMaterial({
 color:0x111216,
 roughness:.85
});

const lavaMaterial=new THREE.MeshStandardMaterial({
 color:0xff102c,
 emissive:0xff001b,
 emissiveIntensity:1.35,
 roughness:.4
});

const darkEyeMaterial=new THREE.MeshStandardMaterial({
 color:0x050505,
 roughness:.3
});

// Smaller torso.
const torso=new THREE.Mesh(
 new THREE.SphereGeometry(.32,24,20),
 bodyMaterial
);
torso.scale.set(.82,.96,.68);
torso.castShadow=true;
scene.add(torso);

// Smaller head, positioned higher.
const head=new THREE.Mesh(
 new THREE.SphereGeometry(.19,24,20),
 bodyMaterial
);
head.castShadow=true;
scene.add(head);

// Small dark face area.
// This removes the obvious gray-looking face patch.
const face=new THREE.Mesh(
 new THREE.SphereGeometry(.125,20,16),
 faceMaterial
);
face.scale.set(1.05,.9,.4);
scene.add(face);

// Eyes.
for(let i=0;i<2;i++){
 const eye=new THREE.Mesh(
  new THREE.SphereGeometry(.028,16,12),
  darkEyeMaterial
 );
 eye.position.set(i===0?-.045:.045,.015,-.045);
 face.add(eye);
}

// Smaller chest patch.
const chest=new THREE.Mesh(
 new THREE.SphereGeometry(.16,20,16),
 chestMaterial
);
chest.scale.set(1.0,1.0,.18);
scene.add(chest);

// Small red chest details.
const chestLava=[];
for(let i=0;i<2;i++){
 const line=new THREE.Mesh(
  new THREE.BoxGeometry(.018,.15,.018),
  lavaMaterial
 );
 line.rotation.z=i===0?-.35:.35;
 scene.add(line);
 chestLava.push(line);
}

// ===================================
// ARMS AND HANDS
// ===================================

const arms=[];

function makeArm(){
 const arm=new THREE.Mesh(
  new THREE.CylinderGeometry(.085,.105,1,16),
  bodyMaterial
 );

 const hand=new THREE.Mesh(
  new THREE.SphereGeometry(.09,16,12),
  bodyMaterial
 );

 const bands=[];

 for(let i=0;i<2;i++){
  const band=new THREE.Mesh(
   new THREE.TorusGeometry(.095,.012,8,24),
   lavaMaterial
  );

  band.rotation.x=Math.PI/2;
  scene.add(band);
  bands.push(band);
 }

 scene.add(arm);
 scene.add(hand);

 return {arm,hand,bands};
}

arms.push(makeArm());
arms.push(makeArm());

function setArmVisible(arm,visible){
 arm.arm.visible=visible;
 arm.hand.visible=visible;

 for(const band of arm.bands){
  band.visible=visible;
 }
}

function updateSegment(mesh,start,end){
 const direction=new THREE.Vector3().subVectors(end,start);
 const length=direction.length();

 mesh.position.copy(start).add(end).multiplyScalar(.5);
 mesh.scale.y=length;

 mesh.quaternion.setFromUnitVectors(
  new THREE.Vector3(0,1,0),
  direction.normalize()
 );
}

// Hide both arms until their controllers connect.
arms.forEach(arm=>setArmVisible(arm,false));

// ===================================
// CONTROLLERS
// ===================================

const controllers=[];

for(let i=0;i<2;i++){
 const controller=renderer.xr.getController(i);

 controller.userData.connected=false;
 controller.userData.handedness=i===0?"left":"right";

 controller.addEventListener("connected",event=>{
  const hand=event.data?.handedness;

  controller.userData.connected=true;

  if(hand==="left" || hand==="right"){
   controller.userData.handedness=hand;
  }

  const index=controller.userData.handedness==="left"?0:1;
  setArmVisible(arms[index],true);

  setStatus(
   (hand||controller.userData.handedness).toUpperCase()+
   " CONTROLLER CONNECTED"
  );
 });

 controller.addEventListener("disconnected",()=>{
  controller.userData.connected=false;

  const index=controller.userData.handedness==="left"?0:1;
  setArmVisible(arms[index],false);

  setStatus(
   controller.userData.handedness.toUpperCase()+
   " CONTROLLER DISCONNECTED"
  );
 });

 playerRig.add(controller);

 const laser=new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([
   new THREE.Vector3(0,0,0),
   new THREE.Vector3(0,0,-4)
  ]),
  new THREE.LineBasicMaterial({color:0xff263f})
 );

 controller.add(laser);

 controller.addEventListener("select",()=>{
  checkController(controller);
 });

 controllers.push(controller);
}

// ===================================
// STATUS
// ===================================

function setStatus(message){
 document.getElementById("status").textContent=message;
}

// ===================================
// COMPUTER INTERACTION
// ===================================

const raycaster=new THREE.Raycaster();
const headPosition=new THREE.Vector3();
const deskPosition=new THREE.Vector3();
const handPosition=new THREE.Vector3();
const shoulder=new THREE.Vector3();

function computerDistance(){
 const view=renderer.xr.getCamera(camera);
 view.getWorldPosition(headPosition);
 deskPosition.set(0,1.6,-7);
 return headPosition.distanceTo(deskPosition);
}

function checkController(controller){
 if(!renderer.xr.isPresenting)return;
 if(computerDistance()>3.5)return;

 const origin=new THREE.Vector3();
 const direction=new THREE.Vector3();
 const rotation=new THREE.Quaternion();

 controller.getWorldPosition(origin);
 controller.getWorldQuaternion(rotation);
 direction.set(0,0,-1).applyQuaternion(rotation);

 raycaster.set(origin,direction);
 raycaster.far=5;

 const hits=raycaster.intersectObjects(menuButtons,false);

 if(hits.length && hits[0].object.userData.action){
  hits[0].object.userData.action();
 }
}

// ===================================
// HEIGHT CALIBRATION
// ===================================

let calibrated=false;
let playerHeight=1.6;
let calibrationAttempts=0;

function calibrateHeight(){
 if(calibrated || !renderer.xr.isPresenting)return;

 const view=renderer.xr.getCamera(camera);
 view.getWorldPosition(headPosition);

 const measuredHeight=headPosition.y-playerRig.position.y;

 if(measuredHeight>.5 && measuredHeight<3){
  playerHeight=THREE.MathUtils.clamp(measuredHeight,1.0,2.3);
  calibrated=true;

  setStatus("VR READY — HEIGHT SET: "+playerHeight.toFixed(2)+" METERS");
  return;
 }

 calibrationAttempts++;

 if(calibrationAttempts>120){
  playerHeight=1.6;
  calibrated=true;
  setStatus("VR READY — DEFAULT HEIGHT SET");
 }
}

// ===================================
// VR START
// ===================================

document.getElementById("enter").addEventListener("click",async()=>{
 try{
  if(!navigator.xr){
   setStatus("OPEN THIS GAME IN QUEST BROWSER");
   return;
  }

  const supported=await navigator.xr.isSessionSupported("immersive-vr");

  if(!supported){
   setStatus("VR NOT SUPPORTED");
   return;
  }

  const session=await navigator.xr.requestSession("immersive-vr",{
   requiredFeatures:["local-floor"],
   optionalFeatures:["hand-tracking"]
  });

  renderer.xr.setReferenceSpaceType("local-floor");
  await renderer.xr.setSession(session);

  playerRig.position.set(0,0,0);
  computer.visible=true;
  showMainMenu();

  calibrated=false;
  playerHeight=1.6;
  calibrationAttempts=0;

  document.getElementById("enter").style.display="none";
  setStatus("REDLINE ARENA — ENTERING VR");

  session.addEventListener("end",()=>{
   computer.visible=false;
   document.getElementById("enter").style.display="block";

   controllers.forEach(controller=>{
    controller.userData.connected=false;
   });

   arms.forEach(arm=>setArmVisible(arm,false));

   setStatus("REDLINE ARENA — READY");
  });

 }catch(error){
  console.error("VR error:",error);
  setStatus("VR ERROR: "+error.message);
 }
});

// ===================================
// WALKING, JUMPING AND COLLISION
// ===================================

let verticalVelocity=0;
let grounded=true;
let jumpWasDown=false;

const gravity=9.8;
const jumpPower=4.2;
const walkSpeed=2.8;

function isOnShelf(x,z){
 const localX=x-shelf.position.x;
 const localZ=z-shelf.position.z;

 return (
  Math.abs(localX)<shelfWidth/2 &&
  Math.abs(localZ)<shelfDepth/2
 );
}

function movePlayer(delta){
 if(!renderer.xr.isPresenting)return;

 const session=renderer.xr.getSession();
 if(!session)return;

 let stickX=0;
 let stickY=0;
 let jumpDown=false;

 for(const source of session.inputSources){
  if(!source.gamepad)continue;

  if(source.handedness==="left"){
   const axes=source.gamepad.axes;

   if(axes.length>=2){
    stickX=axes[axes.length-2]||0;
    stickY=axes[axes.length-1]||0;
   }
  }

  if(source.handedness==="right"){
   const buttons=source.gamepad.buttons;

   jumpDown=!!(
    (buttons[4] && buttons[4].pressed) ||
    (buttons[3] && buttons[3].pressed)
   );
  }
 }

 if(Math.abs(stickX)>.15 || Math.abs(stickY)>.15){
  const view=renderer.xr.getCamera(camera);
  const forward=new THREE.Vector3();

  view.getWorldDirection(forward);
  forward.y=0;
  forward.normalize();

  const right=new THREE.Vector3()
   .crossVectors(forward,new THREE.Vector3(0,1,0))
   .normalize();

  playerRig.position.addScaledVector(forward,-stickY*walkSpeed*delta);
  playerRig.position.addScaledVector(right,stickX*walkSpeed*delta);
 }

 if(jumpDown && !jumpWasDown && grounded){
  verticalVelocity=jumpPower;
  grounded=false;
 }

 jumpWasDown=jumpDown;

 const oldFeetY=playerRig.position.y;

 verticalVelocity-=gravity*delta;
 playerRig.position.y+=verticalVelocity*delta;

 const view=renderer.xr.getCamera(camera);
 view.getWorldPosition(headPosition);

 const shelfBounds=isOnShelf(headPosition.x,headPosition.z);

 if(
  shelfBounds &&
  oldFeetY>=shelfTop-.02 &&
  playerRig.position.y<=shelfTop &&
  verticalVelocity<=0
 ){
  playerRig.position.y=shelfTop;
  verticalVelocity=0;
  grounded=true;
 }

 if(playerRig.position.y<=0){
  playerRig.position.y=0;
  verticalVelocity=0;
  grounded=true;
 }

 if(
  shelfBounds &&
  Math.abs(playerRig.position.y-shelfTop)<.02 &&
  verticalVelocity<=0
 ){
  playerRig.position.y=shelfTop;
  verticalVelocity=0;
  grounded=true;
 }
}

// ===================================
// BODY AND INDEPENDENT ARM TRACKING
// ===================================

function updateBody(){
 if(!renderer.xr.isPresenting)return;

 const view=renderer.xr.getCamera(camera);
 view.getWorldPosition(headPosition);

 // Smaller torso and gorilla proportions.
 torso.position.copy(headPosition);
 torso.position.y-=playerHeight*.43;
 torso.scale.set(
  .82,
  .96*(playerHeight/1.6),
  .68
 );

 // Raise the head and face.
 head.position.copy(headPosition);
 head.position.y-=.13;

 face.position.copy(head.position);
 face.position.y+=.005;
 face.position.z-=.105;

 chest.position.copy(torso.position);
 chest.position.z-=.205;

 chestLava[0].position.set(
  torso.position.x-.04,
  torso.position.y+.015,
  torso.position.z-.235
 );

 chestLava[1].position.set(
  torso.position.x+.04,
  torso.position.y-.015,
  torso.position.z-.235
 );

 for(let i=0;i<2;i++){
  const controller=controllers[i];
  const arm=arms[i];

  // Each arm is handled separately.
  if(!controller.userData.connected){
   setArmVisible(arm,false);
   continue;
  }

  setArmVisible(arm,true);

  controller.getWorldPosition(handPosition);

  shoulder.copy(headPosition);
  shoulder.x+=(controller.userData.handedness==="left"?-.19:.19);
  shoulder.y-=playerHeight*.24;
  shoulder.z+=.035;

  updateSegment(arm.arm,shoulder,handPosition);

  arm.hand.position.copy(handPosition);

  const direction=new THREE.Vector3()
   .subVectors(handPosition,shoulder);

  const length=direction.length();
  direction.normalize();

  for(let b=0;b<arm.bands.length;b++){
   const fraction=b===0?.32:.7;

   arm.bands[b].position.copy(shoulder)
    .addScaledVector(direction,length*fraction);

   arm.bands[b].quaternion.copy(arm.arm.quaternion);
   arm.bands[b].rotateX(Math.PI/2);
  }
 }
}

// ===================================
// MAIN GAME LOOP
// ===================================

let lastTime=performance.now();
let nearComputer=false;

renderer.setAnimationLoop(()=>{
 const now=performance.now();
 const delta=Math.min((now-lastTime)/1000,.05);
 lastTime=now;

 if(renderer.xr.isPresenting){
  if(!calibrated){
   calibrateHeight();
  }

  movePlayer(delta);
  updateBody();

  if(computer.visible){
   const near=computerDistance()<3.5;

   if(near && !nearComputer){
    setStatus("COMPUTER READY — AIM AND PRESS TRIGGER");
   }

   if(!near && nearComputer){
    setStatus("WALK TO THE COMPUTER");
   }

   nearComputer=near;
  }
 }

 renderer.render(scene,camera);
});

// ===================================
// RESIZE
// ===================================

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

// ===================================
// FIREBASE CONNECTION CHECK — PRESERVED


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REDLINE ARENA</title>
<style>
body{margin:0;overflow:hidden;background:#080808;color:white;font-family:Arial}
#enter{
 position:fixed;
 z-index:9999;
 top:25px;
 left:50%;
 transform:translateX(-50%);
 background:#ff102f;
 color:white;
 border:4px solid white;
 border-radius:18px;
 padding:24px 48px;
 font-size:32px;
 font-weight:900;
 box-shadow:0 0 25px #ff102f;
 cursor:pointer;
}
#status{position:fixed;z-index:5;bottom:15px;width:100%;text-align:center;pointer-events:none}
</style>
</head>
<body>
<button id="enter">ENTER VR</button>
<div id="status">REDLINE ARENA — READY</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x080808);
scene.fog=new THREE.Fog(0x080808,10,35);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,100);
camera.position.set(0,1.6,3);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.xr.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x333333,2));
const light=new THREE.PointLight(0xff1735,30,20);
light.position.set(0,4,-3);
scene.add(light);

const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(40,40),
 new THREE.MeshStandardMaterial({color:0x171717})
);
floor.rotation.x=-Math.PI/2;
scene.add(floor);

const grid=new THREE.GridHelper(40,40,0xff1735,0x444444);
grid.position.y=0.02;
scene.add(grid);

for(const x of [-6,6]){
 const wall=new THREE.Mesh(
  new THREE.BoxGeometry(0.3,4,18),
  new THREE.MeshStandardMaterial({color:0x292929,emissive:0x330008})
 );
 wall.position.set(x,2,-4);
 scene.add(wall);
}

function makeText(text,color="#ffffff"){
 const canvas=document.createElement("canvas");
 canvas.width=1024;canvas.height=256;
 const ctx=canvas.getContext("2d");
 ctx.fillStyle="#191919";
 ctx.fillRect(0,0,1024,256);
 ctx.fillStyle=color;
 ctx.font="bold 76px Arial";
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.fillText(text,512,128);
 const texture=new THREE.CanvasTexture(canvas);
 texture.colorSpace=THREE.SRGBColorSpace;
 return texture;
}

const lobby=new THREE.Group();
lobby.position.set(0,1.55,-2.8);
scene.add(lobby);

const panel=new THREE.Mesh(
 new THREE.BoxGeometry(2.8,3.4,0.12),
 new THREE.MeshStandardMaterial({color:0x171717,emissive:0x260008})
);
lobby.add(panel);

const title=new THREE.Mesh(
 new THREE.PlaneGeometry(2.5,0.45),
 new THREE.MeshBasicMaterial({map:makeText("REDLINE ARENA","#ff263f")})
);
title.position.set(0,1.25,0.08);
lobby.add(title);

const statusCanvas=document.createElement("canvas");
statusCanvas.width=1024;statusCanvas.height=180;
const statusCtx=statusCanvas.getContext("2d");
const statusTexture=new THREE.CanvasTexture(statusCanvas);

function updateStatus(message){
 statusCtx.fillStyle="#191919";
 statusCtx.fillRect(0,0,1024,180);
 statusCtx.fillStyle="#ff4055";
 statusCtx.font="bold 48px Arial";
 statusCtx.textAlign="center";
 statusCtx.textBaseline="middle";
 statusCtx.fillText(message,512,90);
 statusTexture.needsUpdate=true;
}
updateStatus("CHOOSE YOUR MODE");

const statusDisplay=new THREE.Mesh(
 new THREE.PlaneGeometry(2.5,0.4),
 new THREE.MeshBasicMaterial({map:statusTexture})
);
statusDisplay.position.set(0,-1.45,0.09);
lobby.add(statusDisplay);

const buttons=[];

function makeButton(label,y,action){
 const button=new THREE.Mesh(
  new THREE.BoxGeometry(2.25,0.34,0.12),
  [
   new THREE.MeshStandardMaterial({color:0x9d1025}),
   new THREE.MeshStandardMaterial({color:0x9d1025}),
   new THREE.MeshStandardMaterial({color:0xff263f}),
   new THREE.MeshStandardMaterial({color:0x55000d}),
   new THREE.MeshBasicMaterial({map:makeText(label)}),
   new THREE.MeshStandardMaterial({color:0x55000d})
  ]
 );
 button.position.set(0,y,0.12);
 button.userData.action=action;
 lobby.add(button);
 buttons.push(button);
}

makeButton("BOSS BATTLE",0.72,()=>updateStatus("BOSS BATTLE SELECTED!"));
makeButton("PLAYER VS PLAYER",0.27,()=>updateStatus("PLAYER VS PLAYER SELECTED!"));
makeButton("CHAOS MODE",-0.18,()=>updateStatus("CHAOS MODE SELECTED!"));
makeButton("PUBLIC SERVERS",-0.72,()=>updateStatus("ONLINE SERVERS COMING NEXT"));
makeButton("PRIVATE ROOM",-1.17,()=>updateStatus("PRIVATE ROOMS COMING NEXT"));

const raycaster=new THREE.Raycaster();
const controllers=[];

function checkButton(controller){
 const origin=new THREE.Vector3();
 const direction=new THREE.Vector3();
 const rotation=new THREE.Quaternion();

 controller.getWorldPosition(origin);
 controller.getWorldQuaternion(rotation);
 direction.set(0,0,-1).applyQuaternion(rotation).normalize();

 raycaster.set(origin,direction);
 raycaster.far=10;

 const hits=raycaster.intersectObjects(buttons,false);
 if(hits.length>0) hits[0].object.userData.action();
}

for(let i=0;i<2;i++){
 const controller=renderer.xr.getController(i);
 scene.add(controller);

 const laser=new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([
   new THREE.Vector3(0,0,0),
   new THREE.Vector3(0,0,-10)
  ]),
  new THREE.LineBasicMaterial({color:0xff263f,depthTest:false})
 );
 laser.renderOrder=999;
 controller.add(laser);

 controller.addEventListener("select",()=>{
  checkButton(controller);
 });

 controllers.push(controller);
}

renderer.domElement.addEventListener("click",event=>{
 const pointer=new THREE.Vector2(
  event.clientX/innerWidth*2-1,
  -(event.clientY/innerHeight)*2+1
 );
 raycaster.setFromCamera(pointer,camera);
 const hits=raycaster.intersectObjects(buttons,false);
 if(hits.length>0) hits[0].object.userData.action();
});

document.getElementById("enter").addEventListener("click",async()=>{
 try{
  if(!navigator.xr){
   document.getElementById("status").textContent="WEBXR NOT AVAILABLE";
   return;
  }

  const supported=await navigator.xr.isSessionSupported("immersive-vr");
  if(!supported){
   document.getElementById("status").textContent="VR NOT SUPPORTED";
   return;
  }

  const session=await navigator.xr.requestSession("immersive-vr",{
   optionalFeatures:["local-floor","hand-tracking"]
  });

  renderer.xr.setReferenceSpaceType("local-floor");
  await renderer.xr.setSession(session);

  document.getElementById("enter").style.display="none";
  document.getElementById("status").textContent="VR CONNECTED — REDLINE ARENA";
  updateStatus("CHOOSE YOUR MODE");

  session.addEventListener("end",()=>{
   document.getElementById("enter").style.display="block";
  });

 }catch(error){
  document.getElementById("status").textContent="VR ERROR: "+error.message;
 }
});

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

renderer.setAnimationLoop(()=>{
 renderer.render(scene,camera);
});
</script>
</body>
</html>
